services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testtask}
      POSTGRES_DB: testtask
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testtask"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=testtask;Username=postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testtask}
      Cors__FrontendOrigin: http://localhost:8080
      Integration__ApiKey: ${INTEGRATION_API_KEY:-local-crm-key}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
